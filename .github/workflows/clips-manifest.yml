name: clips manifest
on:
  push:
    paths:
      - "clips/**"
      - "!clips/manifest.js"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/clips-manifest.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clips/manifest.js
          git diff --cached --quiet || (git commit -m "Update clips manifest" && git push)

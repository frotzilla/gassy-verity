<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gassy Verity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>Gassy Verity</h1>
<p class="sub">Hold Verity (or space) to inflate. Let go.</p>

<canvas id="gasCanvas"></canvas>

<div id="stage">
  <div id="body">
    <svg id="verity" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#fff59a"/>
          <stop offset="0.55" stop-color="#ffd92e"/>
          <stop offset="1" stop-color="#d9a900"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="46" fill="url(#g)"/>
      <ellipse cx="36" cy="44" rx="5" ry="7" fill="#222"/>
      <ellipse cx="64" cy="44" rx="5" ry="7" fill="#222"/>
      <circle cx="34.5" cy="41" r="1.8" fill="#fff"/>
      <circle cx="62.5" cy="41" r="1.8" fill="#fff"/>
      <path id="mouth" d="M33 62 Q50 78 67 62" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<div id="combo"><div id="comboText"></div><div id="comboBar"><div id="comboFill"></div></div></div>
<div id="meter"><div id="fill"></div></div>
<div id="count">Toots: 0</div>
<div id="hint">sound on</div>

<!-- Classic scripts (no build step, works from file://). Order matters. -->
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/puffs.js"></script>
<script src="js/combo.js"></script>
<script src="js/motion.js"></script>
<script src="js/verity.js"></script>
<script src="js/main.js"></script>
</body>
</html>

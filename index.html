<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1230">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Gassy Verity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="world">
  <div id="sky">
    <div id="stars"></div>
    <div id="sun"></div>
    <div id="moon"><div id="moonShade"></div></div>
    <div id="clouds"></div>
    <div id="dim"></div>
  </div>
  <div id="fog"></div>
  <canvas id="weatherCanvas"></canvas>

  <h1>Gassy Verity</h1>
  <p class="sub">Hold Verity (or space) to inflate. Let go.</p>

  <div id="stage">
    <div id="body">
      <div id="verity">
        <img id="skinImg" alt="" draggable="false">
        <svg id="face" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </div>

  <canvas id="gasCanvas"></canvas>
</div>

<div id="flash"></div>
<div id="toast"></div>
<div id="bank"><div id="bankNum">0 gas</div><div id="bankRate"></div></div>
<div id="combo"><div id="comboText"></div><div id="comboBar"><div id="comboFill"></div></div></div>
<div id="meter"><div id="fill"></div></div>
<div id="count">Toots: 0</div>
<div id="hint"></div>
<div id="topBtns"><button id="shopBtn" type="button">shop</button><button id="statsBtn" type="button">stats</button><button id="snapBtn" type="button">snap</button><button id="muteBtn" type="button">sound</button></div>
<div id="statsPanel" hidden></div>
<button id="aboutBtn" class="cornerBtn" type="button">about</button>
<div id="aboutPanel" class="modal" hidden></div>
<div id="adminPanel" class="modal" hidden></div>
<div id="shopPanel"></div>

<!-- Classic scripts (no build step, works from file://). Order matters. -->
<script src="js/config.js"></script>
<script src="assets/manifest.js"></script>
<script src="clips/manifest.js"></script>
<script src="js/format.js"></script>
<script src="js/ui.js"></script>
<script src="js/stats.js"></script>
<script src="js/haptics.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script src="js/puffs.js"></script>
<script src="js/face.js"></script>
<script src="js/skins.js"></script>
<script src="js/combo.js"></script>
<script src="js/sky.js"></script>
<script src="js/motion.js"></script>
<script src="js/blast.js"></script>
<script src="js/clips.js"></script>
<script src="js/verity.js"></script>
<script src="js/shop.js"></script>
<script src="js/achievements.js"></script>
<script src="js/weather.js"></script>
<script src="js/screenshot.js"></script>
<script src="js/about.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
